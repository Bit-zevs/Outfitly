name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: outfitly
          POSTGRES_PASSWORD: outfitly-ci
          POSTGRES_DB: outfitly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outfitly -d outfitly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      OUTFITLY_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=outfitly_test;Username=outfitly;Password=outfitly-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare frontend for API
        run: npm run prepare:api --prefix src/frontend
      - name: Restore
        run: dotnet restore Outfitly.sln
      - name: Build
        run: dotnet build Outfitly.sln --configuration Release --no-restore
      - name: Test including PostgreSQL migrations
        run: dotnet test Outfitly.sln --configuration Release --no-build --logger trx --results-directory TestResults
      - name: Publish API with frontend
        run: dotnet publish src/backend/Outfitly.Api --configuration Release --no-build --output artifacts/publish

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    concurrency:
      group: outfitly-production
      cancel-in-progress: false
    steps:
      - name: Deploy tested commit over SSH
        shell: bash
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "${VPS_DEPLOY_KEY:?Missing VPS_DEPLOY_KEY}" > "$ssh_dir/key"
          printf '%s\n' "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}" > "$ssh_dir/known_hosts"
          ssh -F /dev/null -T -n -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            deploy@155.212.246.57 "deploy:${GITHUB_SHA}"
