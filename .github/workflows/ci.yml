name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: outfitly
          POSTGRES_PASSWORD: outfitly-ci
          POSTGRES_DB: outfitly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outfitly -d outfitly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      OUTFITLY_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=outfitly_test;Username=outfitly;Password=outfitly-ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Outfitly.sln
      - name: Build
        run: dotnet build Outfitly.sln --configuration Release --no-restore
      - name: Test including PostgreSQL migrations
        run: dotnet test Outfitly.sln --configuration Release --no-build --logger trx --results-directory TestResults

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
